name: figures

on:
  push:
  pull_request:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate every figure from the raw dataset
        run: |
          uv sync --locked
          uv run python -m meteorite_landing_data_mining
      - name: Check the committed figures are reproducible
        run: git diff --exit-code -- figures
